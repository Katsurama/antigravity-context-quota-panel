<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>上下文与额度</title>
  <script src="/preload.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --cq-bg: var(--background, #f7f7f8);
      --cq-card: var(--card, #ffffff);
      --cq-subcard: var(--muted, color-mix(in srgb, var(--foreground, #1d1f21) 4.5%, transparent));
      --cq-border: var(--card-border, var(--border, rgba(128, 128, 128, 0.16)));
      --cq-border-soft: color-mix(in srgb, var(--foreground, #1d1f21) 6%, transparent);
      --cq-fg: var(--foreground, #1d1f21);
      --cq-fg-2: var(--secondary-foreground, #3d4348);
      --cq-muted: var(--muted-foreground, #5d676f);
      --cq-shadow: 0 1px 2px color-mix(in srgb, var(--foreground, #000000) 4%, transparent);
      --cq-font: var(--font-family, -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", sans-serif);

      --accent: #7c3aed;
      --accent-soft: rgba(124, 58, 237, 0.11);
      --speed: #0284c7;
      --ok: #16a34a;
      --ok-soft: rgba(22, 163, 74, 0.13);
      --warn: #d97706;
      --warn-soft: rgba(217, 119, 6, 0.14);
      --danger: #dc2626;
      --danger-soft: rgba(220, 38, 38, 0.13);

      --h0: #e9ecf4;
      --h1: #ddd6fe;
      --h2: #a78bfa;
      --h3: #7c3aed;
      --h4: #5b21b6;
      --sel-ring: #4c1d95;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --cq-bg: var(--background, #131316);
        --cq-card: var(--card, #1a1b22);
        --cq-subcard: var(--muted, color-mix(in srgb, var(--foreground, #f4f5f7) 6%, transparent));
        --cq-fg: var(--foreground, #f4f5f7);
        --cq-fg-2: var(--secondary-foreground, #cbd5e1);
        --cq-muted: var(--muted-foreground, #8b92a5);
      }
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --accent: #a78bfa;
      --accent-soft: rgba(167, 139, 250, 0.15);
      --speed: #38bdf8;
      --ok: #22c55e;
      --ok-soft: rgba(34, 197, 94, 0.16);
      --warn: #f59e0b;
      --warn-soft: rgba(245, 158, 11, 0.16);
      --danger: #ef4444;
      --danger-soft: rgba(239, 68, 68, 0.16);

      --h0: #1e202b;
      --h1: #3f1e6b;
      --h2: #652ab7;
      --h3: #9053f8;
      --h4: #c084fc;
      --sel-ring: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--cq-font);
      background: var(--cq-bg);
      color: var(--cq-fg);
      font-size: 11.5px;
      line-height: 1.42;
      overflow-x: hidden;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
    }

    /* 外层内边距放在 .app-shell（避免 preload.js 重置 body.style.padding = '0'） */
    .app-shell {
      padding: 8px;
    }

    .tabular { font-variant-numeric: tabular-nums; }

    .hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      gap: 6px;
    }
    .hdr-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 700;
      min-width: 0;
    }
    .hdr-logo {
      width: 18px;
      height: 18px;
      display: block;
      flex-shrink: 0;
    }
    .hdr-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hdr-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .icon-btn {
      position: relative;
      width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--cq-card);
      border: 1px solid var(--cq-border);
      color: var(--cq-muted);
      border-radius: 6px;
      cursor: pointer;
      flex-shrink: 0;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    .icon-btn:hover {
      color: var(--cq-fg);
      border-color: var(--accent);
      background: var(--cq-subcard);
    }
    .icon-btn.is-spinning svg { animation: spin 0.7s linear infinite; }
    .icon-btn svg { transform-origin: center; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .update-dot {
      display: none;
      position: absolute;
      top: 3px;
      right: 3px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 1.5px var(--cq-card);
    }
    .icon-btn.has-update {
      color: var(--accent);
      border-color: color-mix(in srgb, var(--accent) 50%, transparent);
    }
    .icon-btn.has-update .update-dot { display: block; }
    .update-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      background: var(--accent-soft);
      border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
      border-radius: 8px;
      padding: 5px 8px;
      margin-bottom: 8px;
      font-size: 10.5px;
      color: var(--cq-fg);
    }
    .update-bar-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .update-bar-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 5px;
      padding: 2px 7px;
      font-size: 10px;
      font-weight: 650;
      font-family: inherit;
      cursor: pointer;
    }
    .update-bar-btn:disabled { opacity: 0.6; cursor: wait; }
    .update-bar-close {
      background: transparent;
      border: none;
      color: var(--cq-muted);
      cursor: pointer;
      font-size: 12px;
      line-height: 1;
      padding: 2px 3px;
    }
    .update-bar-close:hover { color: var(--cq-fg); }

    /* 唯一 2 标签导航 */
    .tabs {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      background: var(--cq-card);
      border: 1px solid var(--cq-border);
      border-radius: 8px;
      padding: 3px;
      margin-bottom: 8px;
      gap: 3px;
    }
    .tab-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      background: transparent;
      border: none;
      color: var(--cq-muted);
      font-size: 11px;
      font-weight: 600;
      padding: 5px 6px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.15s, background 0.15s;
    }
    .tab-btn:hover { color: var(--cq-fg-2); }
    .tab-btn.active {
      background: var(--cq-subcard);
      color: var(--cq-fg);
    }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    .card {
      background: var(--cq-card);
      border: 1px solid var(--cq-border);
      border-radius: 10px;
      padding: 9px;
      margin-bottom: 8px;
      box-shadow: var(--cq-shadow);
    }
    .card-hd {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 7px;
    }
    .card-title {
      font-size: 11.5px;
      font-weight: 650;
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-title svg { flex-shrink: 0; }
    .pill {
      font-size: 9.5px;
      font-weight: 650;
      padding: 1.5px 7px;
      border-radius: 999px;
      white-space: nowrap;
      flex-shrink: 0;
      border: none;
      font-family: inherit;
    }
    .pill-btn { cursor: pointer; transition: opacity 0.15s; }
    .pill-btn:hover { opacity: 0.85; }
    .pill-ok { background: var(--ok-soft); color: var(--ok); }
    .pill-warn { background: var(--warn-soft); color: var(--warn); }
    .pill-danger { background: var(--danger-soft); color: var(--danger); }
    .pill-accent { background: var(--accent-soft); color: var(--accent); }

    .conv-name {
      font-size: 10.5px;
      color: var(--cq-muted);
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hero-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 6px;
      gap: 6px;
    }
    .hero-pct {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    .hero-sub {
      font-size: 10.5px;
      color: var(--cq-muted);
      white-space: nowrap;
    }

    .track {
      width: 100%;
      height: 6px;
      background: var(--cq-subcard);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 8px;
      border: 1px solid var(--cq-border-soft);
    }
    .fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1), background 0.25s;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 5px;
      margin-bottom: 7px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 5px;
      margin-bottom: 7px;
    }
    .stat {
      background: var(--cq-subcard);
      border: 1px solid var(--cq-border-soft);
      border-radius: 7px;
      padding: 6px 7px;
      min-width: 0;
    }
    .stat-clickable {
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .stat-clickable:hover { border-color: var(--accent); }
    .stat-k {
      font-size: 9.5px;
      color: var(--cq-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 3px;
    }
    .stat-v {
      font-size: 12.5px;
      font-weight: 700;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .stat-sub {
      font-size: 9.5px;
      color: var(--cq-muted);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 每模型上下文上限行内调整条 */
    .limit-editor {
      display: none;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
      background: var(--cq-subcard);
      border: 1px solid var(--cq-border);
      border-radius: 7px;
      padding: 5px 6px;
      margin-bottom: 7px;
      font-size: 10px;
    }
    .limit-chip {
      background: var(--cq-card);
      border: 1px solid var(--cq-border);
      color: var(--cq-fg-2);
      border-radius: 5px;
      padding: 2px 6px;
      font-size: 10px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }
    .limit-chip.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .spark-wrap {
      background: var(--cq-subcard);
      border: 1px solid var(--cq-border-soft);
      border-radius: 7px;
      padding: 5px 7px;
      margin-bottom: 7px;
    }
    .spark-hd {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 9.5px;
      color: var(--cq-muted);
      margin-bottom: 3px;
    }
    .spark-svg {
      display: block;
      width: 100%;
      height: 24px;
    }

    .meta-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 4px 8px;
      font-size: 10px;
      color: var(--cq-muted);
      padding-top: 6px;
      border-top: 1px solid var(--cq-border-soft);
    }
    .meta-strip strong {
      color: var(--cq-fg-2);
      font-weight: 600;
    }
    .compact-btn {
      width: 100%;
      margin-top: 7px;
      padding: 5px 8px;
      border-radius: 6px;
      border: 1px solid var(--cq-border);
      background: var(--cq-subcard);
      color: var(--cq-fg-2);
      font-size: 10.5px;
      font-weight: 650;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: border-color 0.15s, color 0.15s, background 0.15s, opacity 0.15s;
    }
    .compact-btn:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--cq-fg);
    }
    .compact-btn.is-warn {
      border-color: color-mix(in srgb, var(--warn) 45%, transparent);
      background: var(--warn-soft);
      color: var(--warn);
    }
    .compact-btn.is-warn:hover:not(:disabled) {
      border-color: var(--warn);
      color: var(--warn);
      opacity: 0.92;
    }
    .compact-btn:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    /* Hero 风格当前模型额度卡片（与上下文卡片完全对称直观） */
    .active-group-card {
      background: linear-gradient(155deg, var(--cq-card), color-mix(in srgb, var(--accent) 6%, transparent));
      border: 1px solid color-mix(in srgb, var(--accent) 42%, transparent);
      box-shadow: var(--cq-shadow);
      border-radius: 10px;
      padding: 9px;
      margin-bottom: 8px;
    }
    .active-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 5px var(--ok);
      flex-shrink: 0;
    }
    .q-tile {
      background: var(--cq-subcard);
      border: 1px solid var(--cq-border-soft);
      border-radius: 7px;
      padding: 7px;
      min-width: 0;
    }
    .q-tile.is-tightest {
      border-color: color-mix(in srgb, var(--warn) 45%, transparent);
    }
    .q-tile.is-disabled { opacity: 0.68; }
    .q-tile-hd {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      font-size: 10px;
      color: var(--cq-muted);
      margin-bottom: 3px;
    }
    .q-tile-val {
      font-size: 15px;
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 5px;
    }
    .q-tile-ft {
      font-size: 9.5px;
      color: var(--cq-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tight-badge {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      font-size: 8.5px;
      font-weight: 700;
      padding: 1px 4px;
      border-radius: 4px;
      background: var(--warn-soft);
      color: var(--warn);
      flex-shrink: 0;
    }

    /* 其他模型组折叠 */
    .disclosure-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      background: var(--cq-card);
      border: 1px solid var(--cq-border);
      color: var(--cq-fg-2);
      border-radius: 8px;
      padding: 7px 9px;
      font-size: 11px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      margin-bottom: 8px;
      transition: border-color 0.15s, background 0.15s;
    }
    .disclosure-btn:hover {
      border-color: var(--accent);
      background: var(--cq-subcard);
    }
    .disclosure-chevron {
      transition: transform 0.18s ease;
      color: var(--cq-muted);
    }
    .disclosure-btn[aria-expanded="true"] .disclosure-chevron { transform: rotate(180deg); }
    .other-wrap { margin-bottom: 4px; }

    /* 行内月费设置 */
    .fee-editor {
      display: none;
      align-items: center;
      gap: 5px;
      background: var(--cq-subcard);
      border: 1px solid var(--cq-border);
      border-radius: 7px;
      padding: 6px 7px;
      margin-bottom: 8px;
      font-size: 10.5px;
    }
    .fee-input {
      width: 68px;
      background: var(--cq-card);
      border: 1px solid var(--cq-border);
      color: var(--cq-fg);
      border-radius: 5px;
      padding: 3px 5px;
      font-size: 11px;
      font-family: inherit;
      outline: none;
    }
    .fee-select {
      background: var(--cq-card);
      border: 1px solid var(--cq-border);
      color: var(--cq-fg);
      border-radius: 5px;
      padding: 3px 4px;
      font-size: 10.5px;
      font-family: inherit;
    }
    .fee-save {
      margin-left: auto;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 5px;
      padding: 3px 8px;
      font-size: 10.5px;
      font-weight: 600;
      cursor: pointer;
    }

    /* 构成条 & 模型消耗排行 */
    .comp-wrap {
      background: var(--cq-subcard);
      border: 1px solid var(--cq-border-soft);
      border-radius: 7px;
      padding: 6px 7px;
      margin-bottom: 8px;
    }
    .comp-bar {
      display: flex;
      height: 5px;
      border-radius: 999px;
      overflow: hidden;
      background: var(--cq-card);
      margin-bottom: 5px;
      gap: 1px;
    }
    .comp-seg-in { background: var(--speed); }
    .comp-seg-cache { background: var(--accent); }
    .comp-seg-out { background: var(--ok); }
    .comp-legend {
      display: flex;
      justify-content: space-between;
      gap: 4px;
      font-size: 9.5px;
      color: var(--cq-muted);
      flex-wrap: wrap;
    }
    .comp-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 2px;
      margin-right: 3px;
    }

    .rank-row { margin-bottom: 6px; }
    .rank-row:last-child { margin-bottom: 0; }
    .rank-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 6px;
      font-size: 10.5px;
      margin-bottom: 3px;
    }
    .rank-name {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rank-val {
      color: var(--cq-muted);
      font-size: 10px;
      flex-shrink: 0;
    }

    /* 月历热力图 */
    .heat-hd {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 7px;
      gap: 4px;
    }
    .heat-nav {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--cq-fg-2);
    }
    .nav-mini {
      background: var(--cq-subcard);
      border: 1px solid var(--cq-border);
      color: var(--cq-fg);
      width: 20px;
      height: 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 11px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .nav-mini:hover:not(:disabled) { border-color: var(--accent); }
    .nav-mini:disabled { opacity: 0.35; cursor: default; }
    .month-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 4px;
      margin-bottom: 7px;
    }
    .day-cell {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 650;
      cursor: pointer;
      border: 1px solid transparent;
      user-select: none;
      transition: transform 0.12s ease, border-color 0.12s ease;
    }
    .day-cell:hover:not(.future) {
      transform: translateY(-1px);
      border-color: var(--cq-fg-2);
    }
    .day-cell.selected {
      border-color: var(--sel-ring);
      box-shadow: 0 0 0 1px var(--accent);
    }
    .day-cell.is-today::after {
      content: "";
      position: absolute;
      bottom: 2px;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.9;
    }
    .day-cell.future { opacity: 0.24; cursor: default; }
    .lvl-0 { background: var(--h0); color: var(--cq-muted); }
    .lvl-1 { background: var(--h1); color: #4c1d95; }
    .lvl-2 { background: var(--h2); color: #ffffff; }
    .lvl-3 { background: var(--h3); color: #ffffff; }
    .lvl-4 { background: var(--h4); color: #ffffff; }
    html[data-theme="dark"] .lvl-1 { color: #e9d5ff; }
    html[data-theme="dark"] .lvl-2 { color: #f5f3ff; }
    html[data-theme="dark"] .lvl-4 { color: #1e1033; }

    .day-detail {
      background: var(--cq-subcard);
      border: 1px solid var(--cq-border);
      border-radius: 7px;
      padding: 6px 8px;
      margin-bottom: 7px;
      font-size: 10.5px;
    }
    .heat-legend {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 9.5px;
      color: var(--cq-muted);
      gap: 6px;
    }
    .legend-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .legend-dots {
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .legend-dots i {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 2px;
    }
    .preset-dots {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .preset-dot-btn {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      border: 1.5px solid transparent;
      cursor: pointer;
      padding: 0;
      background: transparent;
    }
    .preset-dot-btn.active {
      border-color: var(--cq-fg);
      transform: scale(1.12);
    }

    .err {
      background: var(--danger-soft);
      border: 1px solid color-mix(in srgb, var(--danger) 35%, transparent);
      color: var(--danger);
      border-radius: 8px;
      padding: 7px 8px;
      margin-bottom: 8px;
      font-size: 10.5px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%) translateY(8px);
      background: var(--cq-fg);
      color: var(--cq-bg);
      font-size: 10.5px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s, transform 0.18s;
      z-index: 99;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>

  <script>
    const PRESETS = {
      purple: { dark: ['#1e202b', '#3f1e6b', '#652ab7', '#9053f8', '#c084fc'], light: ['#e9ecf4', '#ddd6fe', '#a78bfa', '#7c3aed', '#5b21b6'] },
      blue:   { dark: ['#1e202b', '#1e3a8a', '#1d4ed8', '#3b82f6', '#93c5fd'], light: ['#e9ecf4', '#dbeafe', '#93c5fd', '#2563eb', '#1e40af'] },
      green:  { dark: ['#1e202b', '#14532d', '#15803d', '#22c55e', '#86efac'], light: ['#e9ecf4', '#dcfce7', '#86efac', '#16a34a', '#166534'] },
      yellow: { dark: ['#1e202b', '#713f12', '#a16207', '#eab308', '#fde047'], light: ['#e9ecf4', '#fef9c3', '#fde047', '#ca8a04', '#854d0e'] },
    };

    const AUTO_REFRESH_MS = 30_000;

    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
    }

    function applyPreset(name) {
      const theme = document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
      const colors = (PRESETS[name] || PRESETS.purple)[theme];
      colors.forEach((c, i) => document.documentElement.style.setProperty(`--h${i}`, c));
      localStorage.setItem('cq_preset', name);
      document.querySelectorAll('.preset-dot-btn').forEach((el) => {
        el.classList.toggle('active', el.dataset.preset === name);
      });
    }

    function syncHostTheme() {
      const fallbackBg = window.matchMedia('(prefers-color-scheme: dark)').matches ? '#131316' : '#f7f7f8';
      const probe = document.createElement('span');
      probe.style.cssText = `position:absolute;visibility:hidden;color:var(--background, ${fallbackBg})`;
      document.documentElement.appendChild(probe);
      const c = getComputedStyle(probe).color;
      probe.remove();

      let isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const nums = (c.match(/[\d.]+/g) || []).map(Number);
      if (nums.length >= 3) {
        const scale = c.startsWith('color(') ? 1 : 255;
        const [r, g, b] = nums.slice(0, 3).map((v) => v / scale);
        const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
        isDark = lum < 0.5;
      }

      const nextTheme = isDark ? 'dark' : 'light';
      if (document.documentElement.dataset.theme !== nextTheme) {
        document.documentElement.dataset.theme = nextTheme;
      }
      document.documentElement.style.colorScheme = nextTheme;
      applyPreset(localStorage.getItem('cq_preset') || 'purple');
    }

    syncHostTheme();
    new MutationObserver(syncHostTheme).observe(document.documentElement, {
      attributes: true,
      attributeFilter: ['style'],
    });
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncHostTheme);

    document.querySelectorAll('.preset-dot-btn').forEach((btn) => {
      btn.onclick = () => applyPreset(btn.dataset.preset);
    });

    function switchTab(name) {
      document.querySelectorAll('.tab-btn').forEach((b) => b.classList.toggle('active', b.dataset.tab === name));
      document.querySelectorAll('.tab-pane').forEach((p) => p.classList.toggle('active', p.id === `pane-${name}`));
    }
    document.querySelectorAll('.tab-btn').forEach((b) => (b.onclick = () => switchTab(b.dataset.tab)));

    let otherExpanded = false;
    const btnOtherGroups = document.getElementById('btn-other-groups');
    const otherArea = document.getElementById('other-quota-area');
    btnOtherGroups.onclick = () => {
      otherExpanded = !otherExpanded;
      btnOtherGroups.setAttribute('aria-expanded', String(otherExpanded));
      otherArea.style.display = otherExpanded ? 'block' : 'none';
    };

    function getCurrentConversationId() {
      return (
        window.sidecar?.conversationId ||
        new URLSearchParams(window.location.search).get('conversationId') ||
        ''
      );
    }

    let monthOffset = 0;
    let selectedYmd = '';
    let lastData = null;
    let isCompacting = false;

    function apiFetch(url, options = {}) {
      if (window.sidecar?.fetch) {
        return window.sidecar.fetch(url, options);
      }
      return fetch(url, options);
    }

    // 每模型上下文上限自定义覆盖
    function loadModelLimits() {
      try {
        const raw = localStorage.getItem('cq_ctx_limits');
        return raw ? JSON.parse(raw) : {};
      } catch {
        return {};
      }
    }
    function saveModelLimit(modelKey, val) {
      if (!modelKey) return;
      const map = loadModelLimits();
      if (val === 'auto') delete map[modelKey];
      else map[modelKey] = Number(val);
      localStorage.setItem('cq_ctx_limits', JSON.stringify(map));
    }
    function getEffectiveBudget(ctx) {
      const map = loadModelLimits();
      const key = ctx?.canonicalModelId || ctx?.modelId || '';
      const custom = key ? map[key] : null;
      if (Number.isFinite(custom) && custom > 0) {
        return { budget: custom, isCustom: true, key };
      }
      return { budget: ctx?.budgetTokens || 512000, isCustom: false, key };
    }

    const limitEditor = document.getElementById('limit-editor');
    document.getElementById('ctx-limit-box').onclick = () => {
      const open = limitEditor.style.display === 'flex';
      limitEditor.style.display = open ? 'none' : 'flex';
    };
    document.querySelectorAll('.limit-chip').forEach((btn) => {
      btn.onclick = () => {
        if (!lastData?.context) return;
        const key = lastData.context.canonicalModelId || lastData.context.modelId || 'default';
        saveModelLimit(key, btn.dataset.limit);
        limitEditor.style.display = 'none';
        render(lastData);
        showToast(btn.dataset.limit === 'auto' ? '已恢复按模型自动识别上限' : `已设置该模型上限为 ${btn.textContent}`);
      };
    });

    // 自定义月费偏好
    function getSavedFee() {
      try {
        const raw = localStorage.getItem('cq_monthly_fee');
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (parsed && Number.isFinite(parsed.amount) && parsed.amount >= 0) return parsed;
      } catch {}
      return null;
    }

    const feeEditor = document.getElementById('fee-editor');
    document.getElementById('roi-badge').onclick = () => {
      const visible = feeEditor.style.display === 'flex';
      feeEditor.style.display = visible ? 'none' : 'flex';
      if (!visible) {
        const saved = getSavedFee();
        document.getElementById('fee-input').value = saved
          ? String(saved.amount)
          : String(lastData?.plan?.monthlyPriceUsd || 19.99);
        document.getElementById('fee-currency').value = saved?.currency || 'USD';
      }
    };
    document.getElementById('fee-save').onclick = () => {
      const amount = Number(document.getElementById('fee-input').value);
      const currency = document.getElementById('fee-currency').value;
      if (Number.isFinite(amount) && amount >= 0) {
        localStorage.setItem('cq_monthly_fee', JSON.stringify({ amount, currency }));
        feeEditor.style.display = 'none';
        if (lastData) render(lastData);
        showToast('已保存订阅月费');
      }
    };

    function fmtTok(n) {
      if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
      if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
      if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
      return String(Math.round(n || 0));
    }

    function fmtCost(usd, rate = 7.25) {
      const cny = usd * rate;
      return `≈ $${usd.toFixed(2)} (¥${cny.toFixed(1)})`;
    }

    function fmtResetShort(iso) {
      if (!iso) return '未知刷新';
      const ts = Date.parse(iso);
      if (!Number.isFinite(ts)) return iso;
      const diffMs = ts - Date.now();
      const d = new Date(ts);
      const hhmm = d.toTimeString().slice(0, 5);
      if (diffMs <= 0) return `即将刷新 (${hhmm})`;
      const mins = Math.floor(diffMs / 60000);
      const days = Math.floor(mins / 1440);
      const hrs = Math.floor((mins % 1440) / 60);
      const remM = mins % 60;
      if (days > 0) return `${days}天${hrs}h后 (${d.getMonth() + 1}/${d.getDate()} ${hhmm})`;
      if (hrs > 0) return `${hrs}h${remM}m后 (${hhmm})`;
      return `${remM}m后 (${hhmm})`;
    }

    function ctxColor(pct) {
      if (pct >= 85) return 'var(--danger)';
      if (pct >= 65) return 'var(--warn)';
      return 'var(--speed)';
    }

    function quotaColor(pct) {
      if (pct <= 15) return 'var(--danger)';
      if (pct <= 35) return 'var(--warn)';
      return 'var(--ok)';
    }

    function barGradient(colorVar) {
      if (colorVar === 'var(--danger)') return 'linear-gradient(90deg, #ef4444, #f87171)';
      if (colorVar === 'var(--warn)') return 'linear-gradient(90deg, #d97706, #fbbf24)';
      if (colorVar === 'var(--ok)') return 'linear-gradient(90deg, #16a34a, #4ade80)';
      return 'linear-gradient(90deg, #0284c7, #38bdf8)';
    }

    function renderSparkline(trend = [], budget = 512000, strokeColor = 'var(--speed)') {
      const wrap = document.getElementById('spark-wrap');
      const svg = document.getElementById('spark-svg');
      if (!Array.isArray(trend) || trend.length < 2) {
        wrap.style.display = 'none';
        return;
      }
      wrap.style.display = 'block';
      document.getElementById('spark-turns').textContent = `近 ${trend.length} 次调用`;
      const maxVal = Math.max(budget * 0.25, ...trend);
      const W = 200;
      const H = 24;
      const pad = 2;
      const pts = trend.map((v, i) => {
        const x = (i / (trend.length - 1)) * W;
        const y = H - pad - (Math.min(1, v / maxVal) * (H - pad * 2));
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      });
      const areaPts = `0,${H} ${pts.join(' ')} ${W},${H}`;
      svg.innerHTML = `
        <polygon points="${areaPts}" fill="${strokeColor}" fill-opacity="0.14"></polygon>
        <polyline points="${pts.join(' ')}" fill="none" stroke="${strokeColor}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></polyline>
      `;
    }

    function renderGroupHeroCard(g, planName, isActiveCard) {
      const tight = g.tightestBucket || g.buckets[0];
      const tightCol = tight ? (tight.disabled ? 'var(--cq-muted)' : quotaColor(tight.percent)) : 'var(--ok)';
      const tightPct = tight ? (tight.disabled ? 0 : tight.percent) : 0;

      const tilesHtml = (g.buckets || []).map((b) => {
        const isTight = tight && b.bucketId === tight.bucketId;
        const col = b.disabled ? 'var(--cq-muted)' : quotaColor(b.percent);
        const ftText = b.disabled ? '周已耗尽，暂不适用' : fmtResetShort(b.resetTime);
        return `
          <div class="q-tile${isTight ? ' is-tightest' : ''}${b.disabled ? ' is-disabled' : ''}">
            <div class="q-tile-hd">
              <span>${b.windowLabel}</span>
              ${isTight ? '<span class="tight-badge">最紧</span>' : ''}
            </div>
            <div class="q-tile-val tabular" style="color:${col}">${b.disabled ? '已锁定' : `${b.percent}%`}</div>
            <div class="track" style="height:4px;margin-bottom:4px">
              <div class="fill" style="width:${b.disabled ? 0 : b.percent}%;background:${b.disabled ? 'var(--cq-muted)' : barGradient(col)}"></div>
            </div>
            <div class="q-tile-ft tabular">${ftText}</div>
          </div>
        `;
      }).join('');

      return `
        <div class="${isActiveCard ? 'active-group-card' : 'card'}">
          <div class="card-hd">
            <div class="card-title">
              ${isActiveCard ? '<span class="active-dot"></span>' : ''}
              <span>${isActiveCard ? `当前：${g.displayName}` : g.displayName}</span>
            </div>
            ${isActiveCard
              ? `<span class="pill pill-accent">Google AI ${planName}</span>`
              : `<span class="pill pill-danger" style="display:${tightPct === 0 ? 'inline-block' : 'none'}">已耗尽</span>`
            }
          </div>
          <div class="hero-row">
            <span class="hero-pct tabular" style="color:${tightCol}">${tight?.disabled ? '0%' : `${tightPct}%`}</span>
            <span class="hero-sub tabular">${tight ? `${tight.windowLabel} · ${tight.disabled ? '已锁定' : fmtResetShort(tight.resetTime)}` : '--'}</span>
          </div>
          <div class="track">
            <div class="fill" style="width:${tightPct}%;background:${barGradient(tightCol)}"></div>
          </div>
          <div class="grid-2" style="margin-bottom:0">
            ${tilesHtml}
          </div>
        </div>
      `;
    }

    function renderHeatmap(history) {
      const today = new Date();
      const target = new Date(today.getFullYear(), today.getMonth() + monthOffset, 1);
      const y = target.getFullYear();
      const m = target.getMonth();
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      const todayYmd = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

      document.getElementById('heat-month-lbl').textContent = `${y}年${m + 1}月`;
      document.getElementById('btn-m-next').disabled = monthOffset >= 0;

      const dailyMap = history?.dailyMap || {};
      let maxMonthTok = 0;
      for (let day = 1; day <= daysInMonth; day++) {
        const k = `${y}-${String(m + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        if ((dailyMap[k]?.total || 0) > maxMonthTok) maxMonthTok = dailyMap[k].total;
      }

      if (!selectedYmd) selectedYmd = todayYmd;

      const grid = document.getElementById('month-grid');
      grid.innerHTML = '';
      for (let day = 1; day <= daysInMonth; day++) {
        const k = `${y}-${String(m + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const rec = dailyMap[k];
        const tok = rec?.total || 0;
        const isFuture = k > todayYmd;
        let lvl = 0;
        if (tok > 0 && maxMonthTok > 0) {
          const r = tok / maxMonthTok;
          lvl = r >= 0.75 ? 4 : r >= 0.45 ? 3 : r >= 0.2 ? 2 : 1;
        }
        const cell = document.createElement('div');
        cell.className = `day-cell lvl-${lvl}${isFuture ? ' future' : ''}${k === todayYmd ? ' is-today' : ''}${selectedYmd === k ? ' selected' : ''}`;
        cell.textContent = String(day);
        if (!isFuture) {
          cell.onclick = () => {
            selectedYmd = k;
            renderHeatmap(history);
          };
        }
        grid.appendChild(cell);
      }

      const detail = document.getElementById('day-detail');
      const sel = dailyMap[selectedYmd];
      if (sel && sel.total > 0) {
        detail.innerHTML = `
          <div style="display:flex;justify-content:space-between;font-weight:650;margin-bottom:2px" class="tabular">
            <span>${selectedYmd}</span>
            <span style="color:var(--accent)">${fmtTok(sel.total)} · ${fmtCost(sel.costUsd, history.usdToCny)}</span>
          </div>
          <div style="color:var(--cq-muted);font-size:10px" class="tabular">
            输入 ${fmtTok(sel.input)} · 缓存 ${fmtTok(sel.cache)} · 输出 ${fmtTok(sel.output)} · ${sel.calls} 次调用
          </div>
        `;
      } else {
        detail.textContent = `${selectedYmd}：当日暂无记录`;
      }
    }

    document.getElementById('btn-m-prev').onclick = () => {
      monthOffset -= 1;
      if (lastData?.history) renderHeatmap(lastData.history);
    };
    document.getElementById('btn-m-next').onclick = () => {
      if (monthOffset < 0) {
        monthOffset += 1;
        if (lastData?.history) renderHeatmap(lastData.history);
      }
    };

    function render(data) {
      lastData = data;
      const c = data.context;
      const { budget, isCustom } = getEffectiveBudget(c);
      const remaining = Math.max(0, budget - c.usedTokens);
      const pct = Number(Math.min(100, (c.usedTokens / budget) * 100).toFixed(1));
      const cCol = ctxColor(pct);

      // 当前窗口会话标题（只读展示，自动跟随宿主窗口）
      const convTitleEl = document.getElementById('conv-title');
      if (c.title) {
        convTitleEl.textContent = c.title;
        convTitleEl.title = c.title;
        convTitleEl.style.display = 'block';
      } else {
        convTitleEl.style.display = 'none';
      }

      // Section 1: 上下文
      document.getElementById('ctx-hero-pct').textContent = `${pct}%`;
      document.getElementById('ctx-hero-pct').style.color = cCol;
      document.getElementById('ctx-hero-ratio').textContent = `${fmtTok(c.usedTokens)} / ${fmtTok(budget)}`;
      document.getElementById('ctx-bar').style.width = `${pct}%`;
      document.getElementById('ctx-bar').style.background = barGradient(cCol);

      const statusPill = document.getElementById('ctx-status-pill');
      statusPill.textContent = pct >= 85 ? '建议 /compact' : pct >= 65 ? '偏高' : '正常';
      statusPill.className = `pill ${pct >= 85 ? 'pill-danger' : pct >= 65 ? 'pill-warn' : 'pill-ok'}`;

      document.getElementById('ctx-used').textContent = fmtTok(c.usedTokens);
      document.getElementById('ctx-limit').textContent = fmtTok(budget);
      document.getElementById('ctx-limit-tag').textContent = isCustom ? '自定义' : '自动';
      document.getElementById('ctx-rem').textContent = fmtTok(remaining);

      document.querySelectorAll('.limit-chip').forEach((btn) => {
        const match = isCustom ? String(budget) === btn.dataset.limit : btn.dataset.limit === 'auto';
        btn.classList.toggle('active', match);
      });

      renderSparkline(c.trend, budget, cCol);

      document.getElementById('meta-model').innerHTML = `<strong>${c.modelLabel}</strong>`;
      const tpsText = c.speed?.tps > 0 ? `${c.speed.tps} tok/s` : '-- tok/s';
      document.getElementById('meta-speed-cache').textContent = `${tpsText} · 缓存 ${c.cacheHitRate}%`;

      const btnCompact = document.getElementById('btn-compact');
      const btnCompactLbl = document.getElementById('btn-compact-lbl');
      btnCompact.classList.toggle('is-warn', pct >= 75);
      if (!isCompacting) {
        btnCompact.disabled = !c.hasData;
        btnCompactLbl.textContent = pct >= 75 ? '上下文较高 · 一键压缩 (/compact)' : '一键压缩上下文 (/compact)';
      }

      // Section 2: Hero 风格额度卡片
      const activeArea = document.getElementById('active-quota-area');
      activeArea.innerHTML = '';
      otherArea.innerHTML = '';

      const groups = data.quota?.groups || [];
      const otherGroups = [];
      groups.forEach((g) => {
        const cardHtml = renderGroupHeroCard(g, data.plan.name, g.isActive);
        if (g.isActive) {
          activeArea.innerHTML += cardHtml;
        } else {
          otherGroups.push(g);
          otherArea.innerHTML += cardHtml;
        }
      });

      if (otherGroups.length > 0) {
        btnOtherGroups.style.display = 'flex';
        const names = otherGroups.map((g) => g.shortName).join(' / ');
        const anyExhausted = otherGroups.some((g) => g.tightestBucket?.percent === 0);
        document.getElementById('other-groups-label').textContent = `其他模型组 (${names}${anyExhausted ? ' · 含已耗尽' : ''})`;
      } else {
        btnOtherGroups.style.display = 'none';
      }

      // Tab 2: 历史用量
      const h = data.history;
      if (h) {
        document.getElementById('u-total-val').textContent = fmtTok(h.total.tokens);
        document.getElementById('u-total-cost').textContent = fmtCost(h.total.costUsd, h.usdToCny);
        document.getElementById('u-today-val').textContent = fmtTok(h.today.tokens);
        document.getElementById('u-today-cost').textContent = fmtCost(h.today.costUsd, h.usdToCny);
        document.getElementById('u-month-val').textContent = fmtTok(h.month.tokens);
        document.getElementById('u-month-cost').textContent = fmtCost(h.month.costUsd, h.usdToCny);
        document.getElementById('u-year-val').textContent = fmtTok(h.year.tokens);
        document.getElementById('u-year-cost').textContent = fmtCost(h.year.costUsd, h.usdToCny);
        document.getElementById('first-use-lbl').textContent = `首次: ${h.firstDate || '--'}`;

        const savedFee = getSavedFee();
        let monthlyUsd = data.plan.monthlyPriceUsd;
        if (savedFee) {
          monthlyUsd = savedFee.currency === 'CNY' ? savedFee.amount / (h.usdToCny || 7.25) : savedFee.amount;
        }
        const roi = monthlyUsd > 0 ? (h.month.costUsd / monthlyUsd).toFixed(1) : null;
        document.getElementById('roi-badge').textContent = roi ? `本月 ${roi}x 回本` : '设置月费';

        const sumTok = (h.total.input + h.total.cache + h.total.output) || 1;
        const pIn = ((h.total.input / sumTok) * 100).toFixed(1);
        const pCache = ((h.total.cache / sumTok) * 100).toFixed(1);
        const pOut = ((h.total.output / sumTok) * 100).toFixed(1);
        document.getElementById('seg-in').style.width = `${pIn}%`;
        document.getElementById('seg-cache').style.width = `${pCache}%`;
        document.getElementById('seg-out').style.width = `${pOut}%`;
        document.getElementById('leg-in').textContent = `输入 ${pIn}%`;
        document.getElementById('leg-cache').textContent = `缓存 ${pCache}%`;
        document.getElementById('leg-out').textContent = `输出 ${pOut}%`;

        renderHeatmap(h);

        const rankCard = document.getElementById('model-rank-card');
        const rankList = document.getElementById('model-rank-list');
        const list = h.modelBreakdown || [];
        if (list.length > 0) {
          rankCard.style.display = 'block';
          document.getElementById('rank-count-pill').textContent = `Top ${list.length}`;
          rankList.innerHTML = list.map((m) => `
            <div class="rank-row">
              <div class="rank-top">
                <span class="rank-name">${m.label}</span>
                <span class="rank-val tabular">${fmtTok(m.tokens)} · ${m.sharePercent}%</span>
              </div>
              <div class="track" style="height:4px;margin-bottom:0">
                <div class="fill" style="width:${m.sharePercent}%;background:var(--accent)"></div>
              </div>
            </div>
          `).join('');
        } else {
          rankCard.style.display = 'none';
        }
      }
    }

    let pollTimer = null;
    let isRefreshing = false;

    function resetPollTimer() {
      clearInterval(pollTimer);
      pollTimer = setInterval(() => {
        if (!document.hidden) refresh(false);
      }, AUTO_REFRESH_MS);
    }

    function fallbackExecCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      let ok = false;
      try {
        ok = document.execCommand('copy');
      } finally {
        ta.remove();
      }
      if (!ok) throw new Error('execCommand copy failed');
    }

    async function copyText(text, okMsg, silentFail = false) {
      try {
        const res = await apiFetch('/api/copy', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text }),
        });
        if (res.ok) {
          const data = await res.json();
          if (data?.ok) {
            if (okMsg) showToast(okMsg);
            return true;
          }
        }
      } catch {}

      try {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(text);
          if (okMsg) showToast(okMsg);
          return true;
        }
      } catch {}

      try {
        fallbackExecCopy(text);
        if (okMsg) showToast(okMsg);
        return true;
      } catch {}

      if (!silentFail) showToast('复制失败，请手动操作');
      return false;
    }

    document.getElementById('btn-copy').onclick = () => {
      if (!lastData) return;
      const c = lastData.context;
      const { budget } = getEffectiveBudget(c);
      const pct = Number(Math.min(100, (c.usedTokens / budget) * 100).toFixed(1));
      const g = lastData.quota?.activeGroup;
      const qStr = (g?.buckets || [])
        .map((b) => `${b.windowLabel} ${b.disabled ? '已锁定' : b.percent + '%'}`)
        .join(' / ');
      const msg = `[Antigravity 状态] 模型: ${c.modelLabel} | 上下文: ${fmtTok(c.usedTokens)}/${fmtTok(budget)} (${pct}%) | 额度: ${qStr || '--'}`;
      copyText(msg, '已复制当前状态摘要');
    };

    document.getElementById('btn-compact').onclick = async () => {
      if (isCompacting) return;
      const btn = document.getElementById('btn-compact');
      const lbl = document.getElementById('btn-compact-lbl');
      isCompacting = true;
      btn.disabled = true;
      lbl.textContent = '正在触发压缩...';
      try {
        const convId = getCurrentConversationId() || lastData?.context?.conversationId || '';
        const res = await apiFetch('/api/compact', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ conversationId: convId }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data?.ok) {
          throw new Error(data?.error || `HTTP ${res.status}`);
        }
        showToast('已触发 /compact 自动压缩，稍后刷新');
        setTimeout(() => refresh(false), 2500);
        setTimeout(() => refresh(false), 6000);
      } catch (err) {
        const copied = await copyText('/compact', '', true);
        showToast(
          copied
            ? `自动压缩失败，已复制 /compact 供手动粘贴`
            : `自动压缩失败: ${err?.message || '未知错误'}`
        );
      } finally {
        isCompacting = false;
        if (lastData) {
          render(lastData);
        } else {
          btn.disabled = false;
          lbl.textContent = '一键压缩上下文 (/compact)';
        }
      }
    };

    async function refresh(force = false) {
      if (isRefreshing) return;
      isRefreshing = true;
      const errBox = document.getElementById('err-box');
      const refreshBtn = document.getElementById('btn-refresh');
      const startedAt = Date.now();
      if (force) {
        refreshBtn.disabled = true;
        refreshBtn.classList.add('is-spinning');
      }
      try {
        const qs = new URLSearchParams();
        const convId = getCurrentConversationId();
        if (convId) qs.set('conversationId', convId);
        if (force) {
          qs.set('force', '1');
          qs.set('_t', String(startedAt));
        }
        const url = qs.toString() ? `/api/telemetry?${qs.toString()}` : '/api/telemetry';
        const res = await apiFetch(url, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || '读取失败');
        errBox.style.display = 'none';
        render(data);
        if (force) {
          resetPollTimer();
          const elapsed = Date.now() - startedAt;
          if (elapsed < 400) {
            await new Promise((r) => setTimeout(r, 400 - elapsed));
          }
          showToast('已刷新数据');
        }
      } catch (e) {
        errBox.textContent = `读取失败: ${e.message}`;
        errBox.style.display = 'block';
        if (force) showToast('刷新失败');
      } finally {
        isRefreshing = false;
        refreshBtn.disabled = false;
        refreshBtn.classList.remove('is-spinning');
      }
    }

    document.getElementById('btn-refresh').onclick = () => refresh(true);
    document.addEventListener('keydown', (e) => {
      const tag = e.target?.tagName;
      if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
      if ((e.key === 'r' || e.key === 'R') && !e.metaKey && !e.ctrlKey && !e.altKey) {
        refresh(true);
      }
    });

    let isCheckingUpdate = false;
    let isApplyingUpdate = false;

    async function checkUpdate(manual = false) {
      if (isCheckingUpdate || isApplyingUpdate) return;
      isCheckingUpdate = true;
      const btn = document.getElementById('btn-update');
      if (manual) btn.disabled = true;
      try {
        const res = await apiFetch('/api/update/check', { cache: 'no-store' });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data?.ok) {
          throw new Error(data?.error || `HTTP ${res.status}`);
        }
        if (data.hasUpdate) {
          btn.classList.add('has-update');
          btn.title = `发现新版本 v${data.latestVersion}（点击更新）`;
          document.getElementById('update-bar-msg').textContent = `发现新版本 v${data.latestVersion}`;
          document.getElementById('update-bar').style.display = 'flex';
        } else {
          btn.classList.remove('has-update');
          btn.title = `已是最新版本 v${data.currentVersion}`;
          if (manual) showToast(`已是最新版本 v${data.currentVersion}`);
        }
      } catch (err) {
        if (manual) showToast(`检查更新失败: ${err?.message || '网络错误'}`);
      } finally {
        isCheckingUpdate = false;
        btn.disabled = false;
      }
    }

    document.getElementById('btn-update').onclick = () => checkUpdate(true);
    document.getElementById('btn-dismiss-update').onclick = () => {
      document.getElementById('update-bar').style.display = 'none';
    };
    document.getElementById('btn-apply-update').onclick = async () => {
      if (isApplyingUpdate) return;
      isApplyingUpdate = true;
      const btn = document.getElementById('btn-apply-update');
      btn.disabled = true;
      btn.textContent = '更新中...';
      try {
        const res = await apiFetch('/api/update/apply', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: '{}',
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data?.ok) {
          throw new Error(data?.error || `HTTP ${res.status}`);
        }
        showToast(`已更新到 v${data.updatedTo}，正在重载...`);
        setTimeout(() => window.location.reload(), 2000);
      } catch (err) {
        isApplyingUpdate = false;
        btn.disabled = false;
        btn.textContent = '立即更新';
        showToast(`更新失败: ${err?.message || '未知错误'}`);
      }
    };

    resetPollTimer();
    refresh(false);
    if (!sessionStorage.getItem('cq_update_checked')) {
      sessionStorage.setItem('cq_update_checked', '1');
      setTimeout(() => checkUpdate(false), 3000);
    }
  </script>
